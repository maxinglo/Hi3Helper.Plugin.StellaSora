name: Release Stella Sora Plugin

on:
  workflow_dispatch:
    inputs:
      replace_gitee_commit:
        description: Expected old Gitee installer tag commit (only when reissuing a version)
        type: string
        required: false

concurrency:
  group: stella-sora-plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    outputs:
      package: ${{ steps.version.outputs.package }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check project version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml] $project = Get-Content src/Hi3Helper.Plugin.StellaSora/Hi3Helper.Plugin.StellaSora.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version '$version'." }
          $tag = "v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing GitHub tag $tag does not point to this release commit."
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw 'Could not check the existing GitHub tag.'
          }
          $package = "StellaSora_${version}.0_win-x64.zip"
          "version=$version", "tag=$tag", "package=$package" >> $env:GITHUB_OUTPUT
          $releaseJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft -or $release.isPrerelease -or $release.assets.Count -ne 1 -or $release.assets[0].name -cne $package) {
              throw 'Existing GitHub Release does not match the expected standalone installer.'
            }
            'existing=true' >> $env:GITHUB_OUTPUT
          } else {
            'existing=false' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.version.outputs.existing == 'false'
        with:
          global-json-file: global.json
      - name: Build and run regression tests
        if: steps.version.outputs.existing == 'false'
        run: ./scripts/Build.ps1 -Configuration ReleaseNoReflection -Test
      - name: Publish and verify NativeAOT assets
        if: steps.version.outputs.existing == 'false'
        run: ./scripts/Publish.ps1 -Package -NoReflectionO2
      - name: Publish GitHub installer
        if: steps.version.outputs.existing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.version.outputs.package }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $package = "artifacts/packages/$env:PACKAGE_NAME"
          gh release create "$env:RELEASE_TAG" $package --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Stella Sora $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub installer publication failed.' }

  update:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACKAGE_NAME: ${{ needs.release.outputs.package }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish GitHub update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir $env:RUNNER_TEMP --pattern "$env:PACKAGE_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the GitHub installer.' }
          $output = Join-Path $env:RUNNER_TEMP 'stella-sora-update'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME) -DestinationPath $output
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release commit.' }
          ./scripts/Publish-GitHubUpdateFeed.ps1 -Repository "$env:GITHUB_REPOSITORY" -UpdateDirectory $output -Version "$env:RELEASE_VERSION" -Commit $commit

  mirror:
    needs: release
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ needs.release.outputs.package }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Mirror installer and update feed to Gitee
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPLACE_GITEE_COMMIT: ${{ inputs.replace_gitee_commit }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir $env:RUNNER_TEMP --pattern "$env:PACKAGE_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the GitHub installer.' }
          $package = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          $output = Join-Path $env:RUNNER_TEMP 'stella-sora-update'
          Expand-Archive -LiteralPath $package -DestinationPath $output
          $manifestPath = Join-Path $output 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $files = @($manifest.Assets | ForEach-Object { Join-Path $output $_.FilePath }) + @($manifestPath)
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release commit.' }
          $mirror = @{
            Repository = 'maxing_long/hi3helper-plugin-stella-sora'
            Tag = "$env:RELEASE_TAG"
            Commit = $commit
          }
          $replacement = @{}
          if ($env:REPLACE_GITEE_COMMIT) { $replacement.ReplaceInstallerCommit = $env:REPLACE_GITEE_COMMIT }
          ./scripts/Publish-GiteeRelease.ps1 @mirror @replacement -InstallerOnly -Files $package
          ./scripts/Publish-GiteeRelease.ps1 @mirror -UpdateFeed -Files $files
